name: FocusOSShell
options:
  bundleIdPrefix: tech.focusos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Simulator builds need no signing; device builds get identity later (step 3).
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  FocusOSShell:
    type: application
    platform: iOS
    sources: [FocusOSShell]
    info:
      path: FocusOSShell/Info.plist
      properties:
        CFBundleDisplayName: Focus OS
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Focus OS uses the microphone for Brain Dump voice capture."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Empty dict is enough: opts out of legacy letterbox compatibility mode.
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        # Start URL lives here so a Dev flavour (preview channel) is a one-line change.
        FOSStartURL: "https://rogerceaser21.github.io/focus-os/?debug=1"
