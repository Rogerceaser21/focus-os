name: FocusOSShell
options:
  bundleIdPrefix: tech.focusos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Simulator builds stay unsigned (conditional settings below); device builds
    # use Xcode automatic signing with Igor's Personal Team baked in, so
    # regenerating the project never wipes the GUI signing choice.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3V9TZC8UU4
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
targets:
  FocusOSShell:
    type: application
    platform: iOS
    sources: [FocusOSShell]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"

    info:
      path: FocusOSShell/Info.plist
      properties:
        CFBundleDisplayName: Focus OS
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "4"
        NSMicrophoneUsageDescription: "Focus OS uses the microphone for Brain Dump voice capture."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Empty dict is enough: opts out of legacy letterbox compatibility mode.
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        # Start URL lives here so a Dev flavour (preview channel) is a one-line change.
        FOSStartURL: "https://rogerceaser21.github.io/focus-os/"

  # Igor's test bench (2026-08-21): the SAME shell, pointed at the PREVIEW
  # channel, under its own bundle id (tech.focusos.FocusOSShellPreview) and a
  # badged icon, so it installs side by side with the TestFlight app and picks
  # up every preview push on its next launch — no merge needed to test.
  FocusOSShellPreview:
    type: application
    platform: iOS
    # The main target's Info.plist lives inside the shared source folder and
    # must not ride along as a resource (two commands producing Info.plist).
    sources:
      - path: FocusOSShell
        excludes: ["Info.plist"]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconPreview
    info:
      path: FocusOSShellPreview/Info.plist
      properties:
        CFBundleDisplayName: Focus OS Preview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "4"
        NSMicrophoneUsageDescription: "Focus OS uses the microphone for Brain Dump voice capture."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        FOSStartURL: "https://rogerceaser21.github.io/focus-os/preview/"
