name: FocusOSShell
options:
  bundleIdPrefix: tech.focusos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Simulator builds stay unsigned (conditional settings below); device builds
    # use Xcode automatic signing — Igor ticks "Automatically manage signing"
    # and picks his Personal Team in the Xcode GUI.
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
targets:
  FocusOSShell:
    type: application
    platform: iOS
    sources: [FocusOSShell]
    info:
      path: FocusOSShell/Info.plist
      properties:
        CFBundleDisplayName: Focus OS
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Focus OS uses the microphone for Brain Dump voice capture."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Empty dict is enough: opts out of legacy letterbox compatibility mode.
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        # Start URL lives here so a Dev flavour (preview channel) is a one-line change.
        FOSStartURL: "https://rogerceaser21.github.io/focus-os/"
